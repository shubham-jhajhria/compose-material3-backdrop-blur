name: Publish backdrop blur Maven packages

on:
  push:
    branches: [feature/backdrop-blur]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set iOS deployment target
        run: printf 'IPHONEOS_DEPLOYMENT_TARGET = 15.0\n' > "$RUNNER_TEMP/compose-blur-build.xcconfig"
      - name: Publish Android and iOS artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XCODE_XCCONFIG_FILE: ${{ runner.temp }}/compose-blur-build.xcconfig
        run: |
          ./gradlew :mpp:publishComposeJbToGitHubPackages \
            -Pcompose.platforms=ios,android \
            -Pjetbrains.publication.libraries=COMPOSE,COMPOSE_MATERIAL3 \
            --no-configuration-cache \
            -Dorg.gradle.configureondemand=false \
            --parallel --max-workers=6 --console=plain
